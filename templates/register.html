{% extends "base.html" %}

{% block content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-header">
      <div style="font-size: 2rem; color: #38bdf8; margin-bottom: 0.5rem;">
        <i class="fa-solid fa-user-plus"></i>
      </div>
      <h2>Create Your Account</h2>
      <p>Join PocketSmart AI to organize and track your plans</p>
    </div>

    <form id="registerForm" onsubmit="handleRegister(event)">
      <div class="form-group">
        <label class="form-label" for="full_name">Full Name</label>
        <input type="text" id="full_name" name="full_name" class="form-control" placeholder="e.g. Alex Morgan">
      </div>

      <div class="form-group">
        <label class="form-label" for="username">Username</label>
        <input type="text" id="username" name="username" class="form-control" required placeholder="Choose a username">
      </div>

      <div class="form-group">
        <label class="form-label" for="email">Email Address</label>
        <input type="email" id="email" name="email" class="form-control" required placeholder="alex@example.com">
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input type="password" id="password" name="password" class="form-control" required minlength="6" placeholder="At least 6 characters">
      </div>

      <div class="form-group">
        <label class="form-label" for="confirm_password">Confirm Password</label>
        <input type="password" id="confirm_password" name="confirm_password" class="form-control" required minlength="6" placeholder="Repeat password">
      </div>

      <div style="margin-top: 1.5rem;">
        <button type="submit" id="submitBtn" class="btn btn-primary btn-block btn-lg">
          <span>Create Free Account</span>
        </button>
      </div>
    </form>

    <div class="auth-footer">
      Already have an account? <a href="/login">Sign In</a>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
async function handleRegister(e) {
  e.preventDefault();
  
  const full_name = document.getElementById('full_name').value.trim();
  const username = document.getElementById('username').value.trim();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const confirm_password = document.getElementById('confirm_password').value;

  if (password !== confirm_password) {
    showToast('Passwords do not match. Please verify.', 'error');
    return;
  }

  const btn = document.getElementById('submitBtn');
  const originalHtml = btn.innerHTML;
  btn.innerHTML = '<span class="spinner"></span> Creating account...';
  btn.disabled = true;

  try {
    const res = await fetch('/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, email, password, full_name })
    });

    const data = await res.json();
    if (res.ok && data.success) {
      showToast('Account created! Welcome to PocketSmart AI.', 'success');
      setTimeout(() => {
        window.location.href = '/dashboard';
      }, 700);
    } else {
      showToast(data.detail || 'Could not complete registration.', 'error');
      btn.innerHTML = originalHtml;
      btn.disabled = false;
    }
  } catch (err) {
    showToast('Network error during registration.', 'error');
    btn.innerHTML = originalHtml;
    btn.disabled = false;
  }
}
</script>
{% endblock %}
